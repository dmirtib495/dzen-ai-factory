# production E2E trigger: 2026-09-05-v12-install-d1-cap
name: Dzen Production E2E Now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/e2e-now.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dzen-ai-factory-production
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Create environment file
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
          YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          {
            echo "OPENROUTER_API_KEY=$OPENROUTER_API_KEY"
            echo "DEEPSEEK_MODEL=google/gemma-4-31b-it:free"
            echo "OPENROUTER_MODEL=openrouter/free"
            echo "OPENROUTER_EDITOR_MODEL=nvidia/nemotron-3-super-120b-a12b:free"
            echo "YANDEX_API_KEY=$YANDEX_API_KEY"
            echo "YANDEX_FOLDER_ID=$YANDEX_FOLDER_ID"
            echo "YANDEX_MODEL=yandexgpt/latest"
            echo "TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN"
            echo "TELEGRAM_CHAT_ID=$TELEGRAM_CHAT_ID"
            echo "CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN"
            echo "CLOUDFLARE_AI_API_TOKEN=$CLOUDFLARE_AI_API_TOKEN"
            echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID"
            echo "CLOUDFLARE_D1_DATABASE_ID=$CLOUDFLARE_D1_DATABASE_ID"
            echo "ARTICLES_PER_DAY=1"
            echo "OPENROUTER_DAILY_LIMIT=50"
            echo "MIN_ARTICLE_WORDS=900"
            echo "MAX_ARTICLE_WORDS=1400"
            echo "TIMEZONE=Europe/Moscow"
            echo "SCHEDULE_HOURS=6,12,18"
          } > .env
      - name: Validate configuration
        run: python -c "from config import validate; e=validate(); print('config:', 'OK' if not e else e); raise SystemExit(1 if e else 0)"
      - name: Initialize D1
        run: python cloud/init_d1.py
      - name: Shared quota preflight
        id: quota
        run: |
          python - <<'PY'
          import os
          from quota import status as text_status
          from image_quota import status as image_status, FLUX_SCHNELL_NEURONS_PER_IMAGE
          t=text_status(); i=image_status()
          print('TEXT_QUOTA',t)
          print('IMAGE_QUOTA',i)
          can_run = (
              int(t.get('remaining',0)) >= 10 and
              float(i.get('remaining',0)) + 1e-6 >= 3*FLUX_SCHNELL_NEURONS_PER_IMAGE
          )
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as fh:
              fh.write(f"can_run={'true' if can_run else 'false'}\n")
          if can_run:
              print('E2E_QUOTA_PREFLIGHT_OK')
          else:
              print('E2E_SKIPPED_BY_SHARED_DAILY_QUOTA')
          PY
      - name: Sync before generation
        if: steps.quota.outputs.can_run == 'true'
        run: python cloud_sync.py
      - name: Generate one production article
        if: steps.quota.outputs.can_run == 'true'
        run: |
          python -c "from pipeline import generate_batch; n=generate_batch(); print('publication_grade_articles=', n); raise SystemExit(0 if n == 1 else 2)"
      - name: Sync after generation
        if: always()
        run: python cloud_sync.py
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dzen-production-e2e-${{ github.run_number }}
          path: data/
          if-no-files-found: ignore
          retention-days: 7
