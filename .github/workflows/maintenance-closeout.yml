name: Apply Closeout Hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/maintenance-closeout.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply verified source patches
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'Expected text not found in {path}: {old[:80]!r}')
              p.write_text(s.replace(old,new), encoding='utf-8')

          replace('editorial_prompts.py',
              '- статья вне диапазона {MIN_ARTICLE_WORDS}–{MAX_ARTICLE_WORDS};',
              '- статья вне диапазона {MIN_ARTICLE_WORDS}–{MAX_ARTICLE_WORDS} СЛОВ. Считай именно слова, не символы и не токены;')
          replace('editorial_prompts.py',
              'ВЕРДИКТ\nPASS разрешён только если total_score >= 90, blocking_issues пуст и материал действительно публикационного уровня.',
              'ПРОВЕРКА ОБЪЁМА\nДля объёма используй только число русских слов в article_markdown. НИКОГДА не трактуй диапазон {MIN_ARTICLE_WORDS}–{MAX_ARTICLE_WORDS} как символы, знаки или токены. Если не можешь надёжно посчитать слова, не создавай blocking issue про объём — детерминированный quality_checker.py проверит его точно.\n\nВЕРДИКТ\nPASS разрешён только если total_score >= 90, blocking_issues пуст и материал действительно публикационного уровня.')

          replace('main.py',
              "    from pipeline import generate_batch\n    print('Создано материалов:',generate_batch())",
              "    from pipeline import generate_batch\n    generated=generate_batch()\n    print('Создано материалов:', generated)\n    if generated < 1:\n        raise SystemExit('Production run не создал ни одной статьи, прошедшей quality gate')")

          p=Path('topic_hunter.py'); s=p.read_text(encoding='utf-8')
          s=s.replace("diagnostics.append(f'{url}: entries={len(entries)} bozo={getattr(feed,\"bozo\",0)}')",
                      "bozo_exc=getattr(feed,'bozo_exception',None)\n        diagnostics.append(f'{url}: entries={len(entries)} bozo={getattr(feed,\"bozo\",0)} bozo_exception={bozo_exc!r}')\n        skipped_bad=0")
          old="""        for e in entries[:100]:\n            title=clean(getattr(e,'title','')); link=clean(getattr(e,'link','')); summary=clean(getattr(e,'summary',''))\n            if not title or topic_seen(title): continue\n            if not link.startswith(('http://','https://')): continue\n            text=(title+' '+summary).lower()\n            if not any(w in text for w in AUTO_WORDS): continue\n            published=getattr(e,'published_parsed',None)\n            age=12\n            if published:\n                try: age=max(0,(dt.datetime.now(dt.timezone.utc)-dt.datetime(*published[:6],tzinfo=dt.timezone.utc)).total_seconds()/3600)\n                except Exception: pass\n            candidates.append((score(title,summary,age),title,link,source,summary))\n"""
          new="""        for e in entries[:100]:\n            try:\n                title=clean(getattr(e,'title','')); link=clean(getattr(e,'link','')); summary=clean(getattr(e,'summary',''))\n                if not title or topic_seen(title): continue\n                if not link.startswith(('http://','https://')): continue\n                text=(title+' '+summary).lower()\n                if not any(w in text for w in AUTO_WORDS): continue\n                published=getattr(e,'published_parsed',None)\n                age=12\n                if published:\n                    try: age=max(0,(dt.datetime.now(dt.timezone.utc)-dt.datetime(*published[:6],tzinfo=dt.timezone.utc)).total_seconds()/3600)\n                    except Exception: pass\n                candidates.append((score(title,summary,age),title,link,source,summary))\n            except Exception as exc:\n                skipped_bad += 1\n                diagnostics.append(f'{url}: skipped malformed item error={exc!r}')\n        if skipped_bad:\n            diagnostics.append(f'{url}: skipped_bad_entries={skipped_bad}')\n"""
          if old not in s: raise SystemExit('topic_hunter loop pattern not found')
          p.write_text(s.replace(old,new), encoding='utf-8')

          for path in ['.github/workflows/dzen-cloud.yml','.env.example','.env.cloud.example']:
              p=Path(path); s=p.read_text(encoding='utf-8')
              s=s.replace('DEEPSEEK_MODEL=openrouter/free','DEEPSEEK_MODEL=google/gemma-4-31b-it:free')
              s=s.replace('OPENROUTER_EDITOR_MODEL=openrouter/free','OPENROUTER_EDITOR_MODEL=nvidia/nemotron-3-super-120b-a12b:free')
              s=s.replace('DEEPSEEK_MODEL=deepseek/deepseek-chat-v3.1:free','DEEPSEEK_MODEL=google/gemma-4-31b-it:free')
              s=s.replace('OPENROUTER_EDITOR_MODEL=openai/gpt-oss-120b:free','OPENROUTER_EDITOR_MODEL=nvidia/nemotron-3-super-120b-a12b:free')
              p.write_text(s, encoding='utf-8')
          PY
          python -m compileall -q .
          git rm .github/workflows/maintenance-closeout.yml
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Harden JSON generation, RSS parsing and production failure semantics"
          git push
