name: Set Telegram Webhook

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  set-webhook:
    runs-on: ubuntu-latest

    steps:
      - name: Set Telegram webhook
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          curl --fail-with-body \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
            --data-urlencode "url=https://dzen-auto-control.c4dftyhvv2.workers.dev/telegram/webhook"
