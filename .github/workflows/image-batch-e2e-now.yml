name: Image Set E2E Now

on:
  push:
    paths:
      - '.github/workflows/image-batch-e2e-now.yml'

permissions:
  contents: read

concurrency:
  group: dzen-image-generation
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python cloud/init_d1.py
      - name: Generate set for latest quality-approved article
        run: |
          python - <<'PY'
          from cloud_sync import query
          from image_batch import generate_existing_article_set
          r=query("SELECT id,headline FROM articles WHERE quality_ok=1 ORDER BY id DESC LIMIT 1") or {}
          rows=r.get('results',[])
          if not rows:
              raise SystemExit('No quality-approved article in D1')
          article_id=int(rows[0]['id'])
          print('E2E_ARTICLE', article_id, rows[0].get('headline'))
          result=generate_existing_article_set(article_id, artifact_prefix='image-batch')
          print('E2E_BATCH', result['batch_id'])
          PY
      - name: Upload E2E image artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-batch-${{ github.run_number }}
          path: data/image_batches/
          if-no-files-found: error
          retention-days: 7
