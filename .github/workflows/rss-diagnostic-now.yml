name: RSS Diagnostic Now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rss-diagnostic-now.yml'

permissions:
  contents: read

jobs:
  rss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Exact reviews RSS diagnosis and sanitized parser safety
        env:
          OPENROUTER_API_KEY: x
          YANDEX_API_KEY: x
          YANDEX_FOLDER_ID: x
          ARTICLES_PER_DAY: 1
          OPENROUTER_DAILY_LIMIT: 50
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          import requests, feedparser
          from topic_hunter import _xml_safe_named_entities, _parse_feed

          url='https://www.drom.ru/export/xml/reviews.rss'
          raw=requests.get(url,timeout=30); raw.raise_for_status()
          print('HTTP=',raw.status_code,'content_type=',raw.headers.get('content-type'),'bytes=',len(raw.content))

          raw_feed=feedparser.parse(raw.content)
          print('raw_bozo=',raw_feed.bozo)
          print('raw_bozo_exception=',repr(getattr(raw_feed,'bozo_exception',None)))
          try:
              ET.fromstring(raw.content)
              print('raw_stdlib_xml=VALID')
          except ET.ParseError as exc:
              print('raw_stdlib_xml=INVALID')
              print('raw_stdlib_parse_error=',repr(exc),'position=',getattr(exc,'position',None))
              line,col=getattr(exc,'position',(None,None))
              if line:
                  lines=raw.text.splitlines()
                  print('offending_xml_line=',lines[line-1][:1200])

          sanitized=_xml_safe_named_entities(raw.text)
          ET.fromstring(sanitized)
          print('sanitized_stdlib_xml=VALID')
          feed=_parse_feed(url)
          print('sanitized_bozo=',getattr(feed,'bozo',0))
          print('sanitized_bozo_exception=',repr(getattr(feed,'bozo_exception',None)))

          usable=[]; bad=[]
          for i,e in enumerate(feed.entries):
              try:
                  title=str(getattr(e,'title','')).strip()
                  link=str(getattr(e,'link','')).strip()
                  summary=str(getattr(e,'summary','')).strip()
                  if title and link.startswith(('http://','https://')):
                      usable.append((i,title[:120],link[:160]))
                  else:
                      bad.append((i,title[:120],link[:160]))
              except Exception as exc:
                  bad.append((i,'EXCEPTION',repr(exc)))
          print('feed_entries=',len(feed.entries),'usable_entries=',len(usable),'bad_entries=',bad)
          if getattr(feed,'bozo',0):
              raise SystemExit('Sanitized feed is still bozo')
          if bad:
              raise SystemExit(f'Bad entries remain: {bad}')
          PY
      - name: Real topic_hunter run
        env:
          OPENROUTER_API_KEY: x
          YANDEX_API_KEY: x
          YANDEX_FOLDER_ID: x
          ARTICLES_PER_DAY: 1
          OPENROUTER_DAILY_LIMIT: 50
        run: |
          python - <<'PY'
          from topic_hunter import collect_topics
          topics=collect_topics(limit=40)
          print('topic_hunter_result_count=',len(topics))
          print('sample=',[(t['title'],t['link']) for t in topics[:5]])
          PY
