name: Regenerate Image Set
run-name: Regenerate Image Set [article #${{ inputs.article_id }}]

on:
  workflow_dispatch:
    inputs:
      article_id:
        description: 'Article id in D1'
        required: true

permissions:
  contents: read

concurrency:
  group: dzen-image-generation
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
      YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID }}
      YANDEX_MODEL: yandexgpt/latest
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Initialize D1 schema
        run: python cloud/init_d1.py
      - name: Generate article-specific image set
        run: python regenerate_image_batch.py --article-id '${{ inputs.article_id }}'
      - name: Upload image set artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-batch-${{ github.run_number }}
          path: data/image_batches/
          if-no-files-found: error
          retention-days: 7
