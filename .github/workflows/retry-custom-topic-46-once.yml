name: Retry Custom Topic 46 Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retry-custom-topic-46-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch corrected custom topic
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run generate-approved-topic.yml -R dmirtib495/dzen-ai-factory -f proposal_id=46 -f force_run=true
