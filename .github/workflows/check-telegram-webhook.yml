name: Check Telegram Webhook

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-webhook:
    runs-on: ubuntu-latest

    steps:
      - name: Check Telegram webhook
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          curl --fail-with-body \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getWebhookInfo"
