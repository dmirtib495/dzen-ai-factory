name: Image Provider Diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/image-provider-diagnostic.yml'

permissions:
  contents: read

jobs:
  test-images:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install requests Pillow
      - name: Run real Cloudflare Workers AI tests
        run: |
          python - <<'PY'
          import base64, io, json, os, time
          from pathlib import Path
          import requests
          from PIL import Image

          MODEL='@cf/black-forest-labs/flux-1-schnell'
          STEPS=4
          out=Path('image_diagnostic')
          out.mkdir(exist_ok=True)
          results=[]
          cases=[
              ('bmw_5_2021','photorealistic editorial automotive photo of a 2021 BMW 5 Series G30 sedan, front three-quarter view, parked on a modern European boulevard, natural daylight, factory body proportions, correct kidney grille and headlights, no text, no watermark'),
              ('mercedes_e_2021','photorealistic editorial automotive photo of a 2021 Mercedes-Benz E-Class W213 sedan, front three-quarter view, parked outside a business district, natural daylight, factory body proportions, correct grille and headlights, no text, no watermark'),
              ('lexus_es_2021','photorealistic editorial automotive photo of a 2021 Lexus ES sedan, front three-quarter view, parked near contemporary architecture, natural daylight, factory body proportions, correct spindle grille and headlights, no text, no watermark'),
              ('volvo_s90_2021','photorealistic editorial automotive photo of a 2021 Volvo S90 sedan, front three-quarter view, Scandinavian city street, overcast daylight, factory body proportions, correct Thor hammer headlights, no text, no watermark'),
              ('porsche_taycan_2022','photorealistic editorial automotive photo of a 2022 Porsche Taycan, front three-quarter view, parked at an EV charging area, natural daylight, factory body proportions, correct low nose and headlights, no text, no watermark'),
              ('honda_accord_2021','photorealistic editorial automotive photo of a 2021 Honda Accord sedan, front three-quarter view, suburban city road, natural daylight, factory body proportions, correct grille and headlights, no text, no watermark'),
              ('mazda6_2021','photorealistic editorial automotive photo of a 2021 Mazda 6 sedan, front three-quarter view, parked on a clean urban street, golden-hour natural light, factory body proportions, correct grille and headlights, no text, no watermark'),
              ('kia_stinger_2021','photorealistic editorial automotive photo of a 2021 Kia Stinger fastback, front three-quarter view, mountain overlook road, natural daylight, factory body proportions, correct grille and headlights, no text, no watermark'),
              ('ford_mustang_2021','photorealistic editorial automotive photo of a 2021 Ford Mustang coupe, front three-quarter view, parked near an open desert highway, natural daylight, factory body proportions, correct grille and headlights, no text, no watermark'),
              ('hyundai_ioniq5_2022','photorealistic editorial automotive photo of a 2022 Hyundai Ioniq 5, front three-quarter view, modern city charging station, natural daylight, factory pixel-light styling and body proportions, no text, no watermark'),
              ('nissan_gtr_2020','photorealistic editorial automotive photo of a 2020 Nissan GT-R R35, front three-quarter view, parked in a clean underground parking area, realistic fluorescent lighting, factory body proportions, correct grille and headlights, no text, no watermark'),
              ('skoda_octavia_2021','photorealistic editorial automotive photo of a 2021 Skoda Octavia liftback, front three-quarter view, parked on a residential European street, natural daylight, factory body proportions, correct grille and headlights, no text, no watermark'),
          ]
          token=os.getenv('CLOUDFLARE_AI_API_TOKEN','').strip()
          account=os.getenv('CLOUDFLARE_ACCOUNT_ID','').strip()
          if not token:
              raise SystemExit('CLOUDFLARE_AI_API_TOKEN is missing')
          if not account:
              raise SystemExit('CLOUDFLARE_ACCOUNT_ID is missing')
          headers={'Authorization':f'Bearer {token}','Content-Type':'application/json'}
          url=f'https://api.cloudflare.com/client/v4/accounts/{account}/ai/run/{MODEL}'

          for i,(case_id,prompt) in enumerate(cases,1):
              started=time.time()
              row={'provider':'cloudflare','model':MODEL,'attempt':i,'case_id':case_id,'steps':STEPS,'prompt':prompt}
              try:
                  r=requests.post(url,headers=headers,json={'prompt':prompt,'steps':STEPS},timeout=180)
                  row['http_status']=r.status_code
                  row['seconds']=round(time.time()-started,2)
                  row['cf_ray']=r.headers.get('cf-ray')
                  row['cf_ai_neurons']=r.headers.get('cf-ai-neurons')
                  if not r.ok:
                      try:
                          err_payload=r.json()
                          row['response_errors']=err_payload.get('errors')
                          row['response_messages']=err_payload.get('messages')
                      except Exception:
                          row['response_body']=r.text[:1200]
                      raise RuntimeError(f'Cloudflare HTTP {r.status_code}')
                  payload=r.json()
                  image64=(payload.get('result') or {}).get('image')
                  if not image64:
                      raise RuntimeError('No result.image in Cloudflare response')
                  raw=base64.b64decode(image64)
                  im=Image.open(io.BytesIO(raw)); im.load()
                  width,height=im.size
                  path=out/f'{i:02d}_{case_id}.jpg'
                  path.write_bytes(raw)
                  row.update(ok=True,bytes=len(raw),format=im.format,resolution=[width,height],api_usage=(payload.get('result') or {}).get('usage') or payload.get('usage'),file=path.name)
              except Exception as e:
                  row.update(ok=False,seconds=round(time.time()-started,2),error=str(e)[:800])
              results.append(row)
              print('RESULT',json.dumps(row,ensure_ascii=False))

          (out/'results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          if not all(r.get('ok') for r in results):
              raise SystemExit('One or more Cloudflare image generations failed')
          PY
      - name: Upload diagnostic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-provider-diagnostic-12
          path: image_diagnostic/
          if-no-files-found: warn
          retention-days: 7
