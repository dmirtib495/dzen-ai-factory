name: Image Provider Diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/image-provider-diagnostic.yml'

permissions:
  contents: read

jobs:
  test-images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install requests Pillow
      - name: Run real Cloudflare Workers AI tests
        run: |
          python - <<'PY'
          import base64, io, json, math, os, time
          from pathlib import Path
          import requests
          from PIL import Image

          MODEL='@cf/black-forest-labs/flux-1-schnell'
          STEPS=4
          TILE_NEURONS=4.80
          STEP_NEURONS=9.60
          out=Path('image_diagnostic')
          out.mkdir(exist_ok=True)
          results=[]
          prompts=[
              'photorealistic editorial automotive photo of a black Toyota Crown 2017 parked on a clean European city street, natural daylight, realistic proportions, no text, no watermark',
              'photorealistic editorial automotive photo of a silver Audi sedan driving on a mountain road, natural daylight, realistic wheels and body proportions, no text, no watermark',
              'photorealistic editorial automotive photo of a white Tesla Model 3 parked near modern architecture, overcast daylight, realistic reflections, no text, no watermark',
          ]
          token=os.getenv('CLOUDFLARE_AI_API_TOKEN','').strip()
          account=os.getenv('CLOUDFLARE_ACCOUNT_ID','').strip()
          if not token:
              raise SystemExit('CLOUDFLARE_AI_API_TOKEN is missing')
          if not account:
              raise SystemExit('CLOUDFLARE_ACCOUNT_ID is missing')
          headers={'Authorization':f'Bearer {token}','Content-Type':'application/json'}

          schema_url=f'https://api.cloudflare.com/client/v4/accounts/{account}/ai/models/schema'
          schema_r=requests.get(schema_url,headers={'Authorization':f'Bearer {token}'},params={'model':MODEL},timeout=30)
          schema_row={'http_status':schema_r.status_code}
          try:
              schema_payload=schema_r.json()
              schema_row['result']=schema_payload.get('result')
              schema_row['errors']=schema_payload.get('errors')
          except Exception:
              schema_row['body']=schema_r.text[:2000]
          (out/'model_schema.json').write_text(json.dumps(schema_row,ensure_ascii=False,indent=2),encoding='utf-8')
          print('MODEL_SCHEMA',json.dumps(schema_row,ensure_ascii=False)[:4000])

          url=f'https://api.cloudflare.com/client/v4/accounts/{account}/ai/run/{MODEL}'
          for i,prompt in enumerate(prompts,1):
              started=time.time()
              row={'provider':'cloudflare','model':MODEL,'attempt':i,'steps':STEPS}
              try:
                  r=requests.post(url,headers=headers,json={'prompt':prompt,'steps':STEPS,'seed':1000+i},timeout=180)
                  row['http_status']=r.status_code
                  row['seconds']=round(time.time()-started,2)
                  row['cf_ray']=r.headers.get('cf-ray')
                  row['usage_header_candidates']={k:v for k,v in r.headers.items() if 'usage' in k.lower() or 'neuron' in k.lower()}
                  if not r.ok:
                      try:
                          err_payload=r.json()
                          row['response_errors']=err_payload.get('errors')
                          row['response_messages']=err_payload.get('messages')
                      except Exception:
                          row['response_body']=r.text[:1200]
                      raise RuntimeError(f'Cloudflare HTTP {r.status_code}')
                  payload=r.json()
                  image64=(payload.get('result') or {}).get('image')
                  if not image64:
                      raise RuntimeError('No result.image in Cloudflare response')
                  raw=base64.b64decode(image64)
                  im=Image.open(io.BytesIO(raw)); im.load()
                  width,height=im.size
                  tiles=math.ceil(width/512)*math.ceil(height/512)
                  billed_neurons=round(tiles*TILE_NEURONS + STEPS*STEP_NEURONS,2)
                  path=out/f'cloudflare_{i}.jpg'
                  path.write_bytes(raw)
                  row.update(ok=True,bytes=len(raw),format=im.format,resolution=[width,height],tiles_512=tiles,billed_neurons_from_actual_output=billed_neurons,api_usage=(payload.get('result') or {}).get('usage') or payload.get('usage'))
              except Exception as e:
                  row.update(ok=False,seconds=round(time.time()-started,2),error=str(e)[:800])
              results.append(row)
              print('RESULT',json.dumps(row,ensure_ascii=False))

          (out/'results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          if not all(r.get('ok') for r in results):
              raise SystemExit('One or more Cloudflare image generations failed')
          PY
      - name: Upload diagnostic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-provider-diagnostic
          path: image_diagnostic/
          if-no-files-found: warn
          retention-days: 7
