name: Production Acceptance Run

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/acceptance-run.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install check dependencies
        run: pip install requests
      - name: Verify deployed Worker and required secrets
        run: |
          python - <<'PY'
          import requests
          url='https://dzen-auto-control.c4dftyhvv2.workers.dev/health'
          r=requests.get(url, timeout=20)
          print('worker_status=', r.status_code)
          print('worker_health=', r.text)
          r.raise_for_status()
          data=r.json()
          required=['telegram_token_configured','telegram_chat_configured','control_secret_configured','workflow_trigger_configured','d1_configured']
          missing=[k for k in required if not data.get(k)]
          if missing:
              raise SystemExit('Worker missing required bindings/secrets: '+', '.join(missing))
          PY
      - name: Verify configured OpenRouter models still exist and are free
        run: |
          python - <<'PY'
          import requests
          wanted=['deepseek/deepseek-chat-v3.1:free','openai/gpt-oss-120b:free']
          data=requests.get('https://openrouter.ai/api/v1/models', timeout=30).json()['data']
          by_id={m['id']:m for m in data}
          for model_id in wanted:
              if model_id not in by_id:
                  raise SystemExit(f'Configured OpenRouter model is missing: {model_id}')
              p=by_id[model_id].get('pricing') or {}
              print('model=',model_id,'pricing=',p)
              prompt=float(p.get('prompt') or 0)
              completion=float(p.get('completion') or 0)
              if prompt != 0 or completion != 0:
                  raise SystemExit(f'Configured model is no longer free: {model_id}')
          PY
      - name: Dispatch production workflow and wait for completion
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import os,time,requests
          repo=os.environ['REPO']; token=os.environ['GH_TOKEN']; current=int(os.environ['CURRENT_RUN_ID'])
          h={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          dispatch=f'https://api.github.com/repos/{repo}/actions/workflows/dzen-cloud.yml/dispatches'
          r=requests.post(dispatch,headers=h,json={'ref':'main'},timeout=30)
          print('dispatch_status=',r.status_code)
          if r.status_code!=204:
              print(r.text); raise SystemExit(1)
          target=None
          for _ in range(60):
              runs=requests.get(f'https://api.github.com/repos/{repo}/actions/workflows/dzen-cloud.yml/runs?event=workflow_dispatch&per_page=10',headers=h,timeout=30).json().get('workflow_runs',[])
              for run in runs:
                  if run['id'] != current and run['head_branch']=='main':
                      target=run; break
              if target: break
              time.sleep(2)
          if not target: raise SystemExit('Dispatched dzen-cloud run not found')
          run_id=target['id']; print('production_run_id=',run_id); print('production_run_url=',target['html_url'])
          for _ in range(900):
              run=requests.get(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}',headers=h,timeout=30).json()
              if run.get('status')=='completed':
                  print('production_conclusion=',run.get('conclusion'))
                  if run.get('conclusion')!='success':
                      jobs=requests.get(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/jobs',headers=h,timeout=30).json().get('jobs',[])
                      for job in jobs:
                          print('job=',job.get('id'),job.get('name'),job.get('conclusion'))
                      raise SystemExit(2)
                  raise SystemExit(0)
              time.sleep(2)
          raise SystemExit('Timed out waiting for production workflow')
          PY
