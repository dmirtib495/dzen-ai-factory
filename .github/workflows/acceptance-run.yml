# acceptance v4: fixed free models + tagged dispatch
name: Production Acceptance Run

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/acceptance-run.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install check dependencies
        run: pip install requests
      - name: Verify deployed Worker and required secrets
        run: |
          python - <<'PY'
          import requests
          url='https://dzen-auto-control.c4dftyhvv2.workers.dev/health'
          r=requests.get(url, timeout=20)
          print('worker_status=', r.status_code)
          print('worker_health=', r.text)
          r.raise_for_status()
          data=r.json()
          required=['telegram_token_configured','telegram_chat_configured','control_secret_configured','workflow_trigger_configured','d1_configured']
          missing=[k for k in required if not data.get(k)]
          if missing:
              raise SystemExit('Worker missing required bindings/secrets: '+', '.join(missing))
          PY
      - name: Verify fixed free models and router fallback
        run: |
          python - <<'PY'
          import requests
          wanted=['google/gemma-4-31b-it:free','nvidia/nemotron-3-super-120b-a12b:free','openrouter/free']
          data=requests.get('https://openrouter.ai/api/v1/models', timeout=30).json()['data']
          by_id={m['id']:m for m in data}
          for model_id in wanted:
              m=by_id.get(model_id)
              if not m:
                  print('model=',model_id,'status=MISSING')
                  if model_id=='openrouter/free': raise SystemExit('Final router fallback is missing')
                  continue
              p=m.get('pricing') or {}
              params=m.get('supported_parameters') or []
              print('model=',model_id,'context=',m.get('context_length'),'pricing=',p,'response_format=',('response_format' in params))
              if float(p.get('prompt') or 0) != 0 or float(p.get('completion') or 0) != 0:
                  raise SystemExit(f'Model is no longer free: {model_id}')
          PY
      - name: Dispatch production workflow and wait for completion
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os,time,requests
          repo=os.environ['REPO']; token=os.environ['GH_TOKEN']
          h={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          runs_url=f'https://api.github.com/repos/{repo}/actions/workflows/dzen-cloud.yml/runs?event=workflow_dispatch&per_page=30'
          before={r['id'] for r in requests.get(runs_url,headers=h,timeout=30).json().get('workflow_runs',[])}
          dispatch=f'https://api.github.com/repos/{repo}/actions/workflows/dzen-cloud.yml/dispatches'
          r=requests.post(dispatch,headers=h,json={'ref':'main','inputs':{'trigger_source':'acceptance-api'}},timeout=30)
          print('dispatch_status=',r.status_code)
          if r.status_code!=204:
              print(r.text); raise SystemExit(1)
          target=None
          for _ in range(60):
              runs=requests.get(runs_url,headers=h,timeout=30).json().get('workflow_runs',[])
              fresh=[run for run in runs if run['id'] not in before and run['head_branch']=='main']
              if fresh:
                  target=max(fresh,key=lambda x:x['id']); break
              time.sleep(2)
          if not target: raise SystemExit('Dispatched dzen-cloud run not found')
          run_id=target['id']; print('production_run_id=',run_id); print('production_run_url=',target['html_url']); print('production_run_name=',target.get('display_title'))
          for _ in range(900):
              run=requests.get(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}',headers=h,timeout=30).json()
              if run.get('status')=='completed':
                  print('production_conclusion=',run.get('conclusion'))
                  jobs=requests.get(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/jobs',headers=h,timeout=30).json().get('jobs',[])
                  for job in jobs:
                      print('job=',job.get('id'),job.get('name'),job.get('conclusion'))
                  if run.get('conclusion')!='success': raise SystemExit(2)
                  raise SystemExit(0)
              time.sleep(2)
          raise SystemExit('Timed out waiting for production workflow')
          PY
