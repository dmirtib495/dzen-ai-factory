name: Trigger Force Topic 29 Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-force-topic-23-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch forced approved-topic workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run generate-approved-topic.yml -R dmirtib495/dzen-ai-factory -f proposal_id=29 -f force_run=true
