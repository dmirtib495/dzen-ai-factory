name: Dzen Access Diagnostic

on:
  push:
    paths:
      - '.github/workflows/dzen-access-diagnostic.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe dzen.guru public analytics pages
        run: |
          python - <<'PY'
          import re, requests
          urls = [
            'https://dzen.guru/channels/niche/avto',
            'https://dzen.guru/channels/zr.ru',
            'https://dzen.guru/channels/zr.ru/posts',
          ]
          headers={
            'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36',
            'Accept-Language':'ru-RU,ru;q=0.9,en;q=0.5',
          }
          for url in urls:
            r=requests.get(url,headers=headers,timeout=30)
            print('\nURL',url,'STATUS',r.status_code,'LEN',len(r.text),'TYPE',r.headers.get('content-type'))
            text=r.text
            for key in ['За рулем','Автовыбор','просмотров','Топ-публикации','__NEXT_DATA__','/_next/','/api/','posts']:
              print('KEY',key,'COUNT',text.lower().count(key.lower()))
            scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)',text,re.I)
            print('SCRIPTS',scripts[:30])
            hrefs=re.findall(r'href=["\']([^"\']+)',text,re.I)
            interesting=[h for h in hrefs if 'posts' in h or '/api/' in h or 'channels/' in h]
            print('INTERESTING_HREFS',interesting[:50])
            endpoints=sorted(set(re.findall(r'["\']([^"\']*(?:/api/|posts[^"\']*)[^"\']*)["\']',text,re.I)))
            print('ENDPOINT_LIKE',endpoints[:50])
          PY
