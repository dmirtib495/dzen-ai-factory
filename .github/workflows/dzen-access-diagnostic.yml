name: Dzen Access Diagnostic

on:
  push:
    paths:
      - '.github/workflows/dzen-access-diagnostic.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Verify production Dzen trend parser
        run: |
          python - <<'PY'
          from dzen_trends import fetch_top_auto_channels, fetch_auto_trends
          channels=fetch_top_auto_channels(8)
          print('TOP_CHANNELS',[(x['slug'],x['title'],x['views30days']) for x in channels])
          if len(channels) < 5:
              raise SystemExit(f'Expected at least 5 parsed auto channels, got {len(channels)}')
          trends=fetch_auto_trends(top_channels=8,posts_per_channel=12,period=30,limit=30)
          print('TOP_TRENDS',[(x.channel_title,x.views,x.title) for x in trends[:10]])
          if len(trends) < 10:
              raise SystemExit(f'Expected at least 10 article trends, got {len(trends)}')
          if not all(x.url.startswith('https://dzen.ru/a/') for x in trends):
              raise SystemExit('Non-article URL leaked into trend list')
          PY
