name: Dzen Access Diagnostic

on:
  push:
    paths:
      - '.github/workflows/dzen-access-diagnostic.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect dzen.guru post-table JavaScript
        run: |
          python - <<'PY'
          import re, requests
          base='https://dzen.guru'
          page=requests.get(base+'/channels/zr.ru/posts',headers={'User-Agent':'Mozilla/5.0'},timeout=30).text
          scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)',page,re.I)
          print('SCRIPTS',len(scripts))
          needles=['supabase','channel_posts','posts','views','reach','publication','publisher','slug','select(','from(']
          for src in scripts:
            if not src.startswith('/_next/static/chunks/'):
              continue
            try:
              text=requests.get(base+src,headers={'User-Agent':'Mozilla/5.0'},timeout=30).text
            except Exception:
              continue
            low=text.lower()
            if not any(n in low for n in ['supabase','channelposts','poststable','views30days','reachperpublication']):
              continue
            print('\nCHUNK',src,'LEN',len(text))
            for needle in needles:
              hits=[m.start() for m in re.finditer(re.escape(needle.lower()),low)]
              if not hits: continue
              print(' NEEDLE',needle,'HITS',len(hits))
              for pos in hits[:8]:
                snippet=re.sub(r'\s+',' ',text[max(0,pos-450):pos+900])
                print('  CTX',snippet[:1400])
          PY
