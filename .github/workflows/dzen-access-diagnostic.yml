name: Dzen Access Diagnostic

on:
  push:
    paths:
      - '.github/workflows/dzen-access-diagnostic.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect dzen.guru post fields
        run: |
          python - <<'PY'
          import html, re, requests
          text=requests.get(
            'https://dzen.guru/channels/zr.ru/posts',
            headers={'User-Agent':'Mozilla/5.0','Accept-Language':'ru-RU,ru;q=0.9'},
            timeout=30,
          ).text
          # Unescape the Next.js flight stream one level for readable diagnostics.
          decoded=html.unescape(text).replace('\\"','"').replace('\\n',' ')
          print('STATUS_LEN',len(text),len(decoded))
          for key in ['views','reach','title','publishedAt','publication','externalUrl','dzen.ru']:
            hits=list(re.finditer(key,decoded,re.I))
            print('\nKEY',key,'HITS',len(hits))
            for m in hits[:12]:
              a=max(0,m.start()-350); b=min(len(decoded),m.end()+700)
              snippet=re.sub(r'\s+',' ',decoded[a:b])
              print('CTX',snippet[:1200])
          PY
