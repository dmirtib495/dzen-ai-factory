name: Dzen AI Factory - Cloud
run-name: Dzen AI Factory - Topic Choice [${{ github.event.inputs.trigger_source || 'schedule' }}]

on:
  workflow_dispatch:
    inputs:
      trigger_source:
        description: 'Who requested topic selection'
        required: false
        default: 'manual-ui'

permissions:
  contents: read

concurrency:
  group: dzen-ai-factory-topic-proposals
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Create environment file
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          {
            echo "TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN"
            echo "TELEGRAM_CHAT_ID=$TELEGRAM_CHAT_ID"
            echo "CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN"
            echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID"
            echo "CLOUDFLARE_D1_DATABASE_ID=$CLOUDFLARE_D1_DATABASE_ID"
            echo "ARTICLES_PER_DAY=1"
            echo "TIMEZONE=Europe/Moscow"
          } > .env
      - name: Validate Python sources
        run: python -m compileall -q .
      - name: Initialize Cloudflare D1
        run: python cloud/init_d1.py
      - name: Sync cloud database
        run: python cloud_sync.py
      - name: Select fresh topic candidates and ask in Telegram
        run: python propose_topics.py
