name: Dzen AI Factory - Cloud

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
    - cron: "0 9 * * *"
    - cron: "0 15 * * *"

permissions:
  contents: read

concurrency:
  group: dzen-ai-factory-production
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Create environment file
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
          YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          {
            echo "OPENROUTER_API_KEY=$OPENROUTER_API_KEY"
            echo "DEEPSEEK_MODEL=deepseek/deepseek-chat-v3.1:free"
            echo "OPENROUTER_MODEL=openrouter/free"
            echo "OPENROUTER_EDITOR_MODEL=openai/gpt-oss-120b:free"
            echo "OPENAI_API_KEY=$OPENAI_API_KEY"
            echo "OPENAI_MODEL=gpt-5-mini"
            echo "YANDEX_API_KEY=$YANDEX_API_KEY"
            echo "YANDEX_FOLDER_ID=$YANDEX_FOLDER_ID"
            echo "YANDEX_MODEL=yandexgpt/latest"
            echo "TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN"
            echo "TELEGRAM_CHAT_ID=$TELEGRAM_CHAT_ID"
            echo "CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN"
            echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID"
            echo "CLOUDFLARE_D1_DATABASE_ID=$CLOUDFLARE_D1_DATABASE_ID"
            echo "ARTICLES_PER_DAY=1"
            echo "OPENROUTER_DAILY_LIMIT=50"
            echo "TIMEZONE=Europe/Moscow"
            echo "SCHEDULE_HOURS=6,12,18"
            echo "MIN_ARTICLE_WORDS=900"
            echo "MAX_ARTICLE_WORDS=1400"
          } > .env
      - name: Validate Python sources
        run: python -m compileall -q .
      - name: Validate configuration
        run: python -c "from config import validate; e=validate(); print('config:', 'OK' if not e else e); raise SystemExit(1 if e else 0)"
      - name: Require Yandex AI credentials
        run: |
          python - <<'PY'
          import os
          from dotenv import load_dotenv
          load_dotenv('.env')
          missing = [k for k in ('YANDEX_API_KEY','YANDEX_FOLDER_ID') if not os.getenv(k,'').strip()]
          if missing:
              raise SystemExit('Missing required Yandex AI secrets: ' + ', '.join(missing))
          print('Yandex AI credentials: present')
          PY
      - name: Initialize Cloudflare D1
        run: python cloud/init_d1.py
      - name: Sync cloud database
        run: python cloud_sync.py
      - name: Generate article
        run: python main.py --once
      - name: Sync results to Cloudflare D1
        if: always()
        run: python cloud_sync.py
      - name: Upload generated artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dzen-factory-${{ github.run_number }}
          path: data/
          if-no-files-found: ignore
          retention-days: 7
