name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENROUTER_API_KEY: ci-placeholder
      YANDEX_API_KEY: ci-placeholder
      YANDEX_FOLDER_ID: ci-placeholder
      ARTICLES_PER_DAY: "1"
      OPENROUTER_DAILY_LIMIT: "50"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile Python
        run: python -m compileall -q .
      - name: Run test suite
        run: python -m pytest tests/ -v
      - name: Validate production RSS feeds
        run: |
          python - <<'PY'
          import feedparser
          from config import RSS_SOURCES
          assert RSS_SOURCES, 'RSS_SOURCES is empty'
          for url in RSS_SOURCES:
              feed = feedparser.parse(url)
              print(f'RSS {url}: entries={len(feed.entries)} bozo={getattr(feed, "bozo", 0)}')
              assert len(feed.entries) > 0, f'RSS has no entries: {url}'
          PY
      - name: Validate configuration
        run: python -c "from config import validate; e=validate(); print('config:', 'OK' if not e else e); raise SystemExit(1 if e else 0)"
      - name: Validate professional prompt contracts
        run: |
          python - <<'PY'
          from editorial_prompts import EDITORIAL_SYSTEM, draft_prompt, yandex_editor_prompt, final_editor_prompt, quality_auditor_prompt, repair_prompt
          topic={'source':'CI source','title':'Как выбрать подержанный автомобиль без лишних расходов','link':'https://example.com/article','summary':'Краткое описание темы для теста.'}
          material={'headline':topic['title'],'headlines':[topic['title']]*5,'category':'Экономия','article_markdown':'## Тест\nТекст','fact_check':['Проверить: тест']*3,'image_prompt':'realistic editorial automotive photo in natural light','source_urls':[topic['link']],'commercial_intent':5}
          draft=draft_prompt(topic,[topic['link']]); yandex=yandex_editor_prompt(material); final=final_editor_prompt(material); audit=quality_auditor_prompt(material); repair=repair_prompt(material,['Мало слов'],{'verdict':'REVISE','blocking_issues':['Мало слов']},1)
          assert 'доказательность' in EDITORIAL_SYSTEM.lower()
          assert 'не выдумывай' in EDITORIAL_SYSTEM.lower()
          assert ('1080' in draft or '1050' in draft) and '5–8' in draft and 'чек-лист' in draft
          assert '12 КРИТЕРИЕВ' in final
          assert 'независимый руководитель контроля качества' in audit
          assert 'PASS' in audit and 'blocking_issues' in audit and '>= 90' in audit
          assert 'senior rewrite editor' in repair.lower()
          print('Professional prompt contracts: OK')
          PY
      - name: Validate deterministic quality gate
        run: |
          python - <<'PY'
          from quality_checker import check_article
          bad={'headline':'Шок! Лучшая машина 100% без проблем','article_markdown':'## Раздел\nВсегда покупайте именно так.','fact_check':[],'source_urls':[],'image_prompt':''}
          result=check_article(bad,require_ai_audit=True)
          assert not result['ok'] and result['score'] < 90 and len(result['problems']) >= 5
          print('Deterministic quality gate: OK')
          PY
