name: Set Cloudflare Worker Secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  set-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Wrangler
        run: npm install --no-save wrangler@latest

      - name: Set TELEGRAM_BOT_TOKEN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VALUE: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          printf '%s' "$SECRET_VALUE" | npx wrangler secret put TELEGRAM_BOT_TOKEN --config wrangler.jsonc

      - name: Set TELEGRAM_CHAT_ID
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VALUE: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          printf '%s' "$SECRET_VALUE" | npx wrangler secret put TELEGRAM_CHAT_ID --config wrangler.jsonc

      - name: Set CONTROL_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_VALUE: ${{ secrets.CONTROL_SECRET }}
        run: |
          printf '%s' "$SECRET_VALUE" | npx wrangler secret put CONTROL_SECRET --config wrangler.jsonc

      - name: Check Worker health
        run: |
          sleep 5
          curl --fail-with-body "https://dzen-auto-control.c4dftyhvv2.workers.dev/health"
