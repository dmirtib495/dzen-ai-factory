name: Install Dzen AI Factory

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack project
  run: |
    unzip -oq dzen_ai_factory_bundle.zip -d .
    rm -f dzen_ai_factory_bundle.zip
    rm -f .github/workflows/dzen-cloud.yml

      - name: Commit project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Install Dzen AI Factory"
          git push
