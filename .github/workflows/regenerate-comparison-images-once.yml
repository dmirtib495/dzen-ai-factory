name: Regenerate Comparison Images Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/regenerate-comparison-images-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch corrected image set for article 12
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run image-batch.yml -R dmirtib495/dzen-ai-factory -f article_id=12
